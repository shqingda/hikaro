name: release candidate
run-name: Candidate validation · ${{ github.sha }}
on:
  workflow_dispatch:
  # Exercise changes to this release pipeline on their own branch. Ordinary
  # product pushes do not automatically start the expensive packaging check.
  push:
    paths:
      - .github/workflows/release-candidate.yml
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 20
    defaults:
      run:
        shell: zsh -euo pipefail {0}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2
          cache: false
      - name: Verify release platform and tools
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          node --version
          command -v rg || brew install ripgrep
      - name: Install source dependencies into an empty store
        run: pnpm install --frozen-lockfile --filter hikaro --store-dir "$RUNNER_TEMP/hikaro-pnpm-store"
      - name: Check types and release security contracts
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/runtime-lifecycle.test.ts -t 'workspace directory'
          pnpm exec vitest run tests/steering-recovery.test.ts tests/steering-queue.test.ts
          node --test scripts/package-release.test.mjs scripts/release-audit.test.mjs scripts/forge-patch.test.mjs
      - name: Build and audit candidate
        run: pnpm release:pack
      - name: Install candidate with empty npm cache and exercise installed TUI
        run: pnpm check:release artifacts/release/hikaro-0.1.0-darwin-arm64.tgz
      - name: Retain verified candidate and reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hikaro-darwin-arm64-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
