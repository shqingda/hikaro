name: release
run-name: Release · ${{ github.ref_name }}
# Push a vX.Y.Z tag whose version matches package.json and which has
# docs/releases/vX.Y.Z.md. Builds the curl-installable CLI,
# then publishes it in one GitHub Release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  cli:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        shell: zsh -euo pipefail {0}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
          cache: false
      - name: Check tag, version and release notes
        run: |
          test "$(uname -m)" = arm64
          version=$(node -p 'require("./package.json").version')
          test "${GITHUB_REF_NAME}" = "v$version"
          test -s "docs/releases/${GITHUB_REF_NAME}.md"
          command -v rg || brew install ripgrep
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/hikaro-pnpm-store"
      - name: Build standalone CLI
        run: pnpm release:cli
      - name: Install from the built files and run the installed CLI
        run: |
          out=artifacts/release/cli
          (cd $out && shasum -a 256 -c hikaro-*-SHA256SUMS.txt)
          python3 -m http.server 8765 --bind 127.0.0.1 --directory $out &
          server=$!
          sleep 1
          export HOME="$RUNNER_TEMP/install-home"
          mkdir -p "$HOME"
          curl -fsSL http://127.0.0.1:8765/install.sh |
            HIKARO_DOWNLOAD_BASE=http://127.0.0.1:8765 HIKARO_NO_MODIFY_PATH=1 sh
          version=$(node -p 'require("./package.json").version')
          test "$(env -i HOME=$HOME PATH=/usr/bin:/bin $HOME/.local/bin/hk --version)" = "hikaro $version"
          env -i HOME=$HOME PATH=/usr/bin:/bin $HOME/.local/bin/hikaro --help > /dev/null
          kill $server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli
          path: artifacts/release/cli/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist-release
          sha256sum -c hikaro-*-SHA256SUMS.txt
          # The notes file's first heading becomes the release title.
          notes="$GITHUB_WORKSPACE/docs/releases/${GITHUB_REF_NAME}.md"
          title=$(sed -n '1s/^# //p' "$notes")
          sed '1,2d' "$notes" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$title" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest \
            install.sh latest-darwin-arm64.txt hikaro-*-darwin-arm64.tar.gz \
            hikaro-*-SHA256SUMS.txt
