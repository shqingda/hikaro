name: manual TUI checks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
